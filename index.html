<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS-D Voice & AI Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    .app {
      max-width: 620px;
      margin: auto;
      background: #1e293b;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 22px;
      color: #38bdf8;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .key-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .key-box input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
    }
    .key-box button, .voice-toggle {
      background: #475569;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .quick-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .quick-btns button {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .chat-box {
      background: #0f172a;
      border-radius: 10px;
      padding: 12px;
      min-height: 230px;
      max-height: 360px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .msg {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 8px;
      line-height: 1.45;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .user {
      background: #2563eb;
      text-align: right;
    }
    .bot {
      background: #334155;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    .input-row input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }
    .mic-btn {
      background: #f59e0b;
      color: #111827;
      font-weight: bold;
      border: none;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .send-btn {
      background: #22c55e;
      color: #052e16;
      font-weight: bold;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>JARVIS-D</h1>
    <div class="subtitle">Personal Voice & Live AI Assistant (v0.2)</div>

    <div class="key-box">
      <input type="password" id="apiKeyInput" placeholder="यहाँ अपनी Gemini API Key डालें..." />
      <button onclick="saveApiKey()">सेव करें</button>
    </div>

    <div class="top-bar">
      <span id="statusText" style="font-size:12px; color:#94a3b8;">तैयार</span>
      <button class="voice-toggle" id="voiceToggleBtn" onclick="toggleVoice()">🔊 आवाज़: चालू</button>
    </div>

    <div class="quick-btns">
      <button onclick="quickAsk('आज के कामों का छोटा और साफ प्लान बनाओ')">आज का प्लान</button>
      <button onclick="quickAsk('एक नया आइडिया दो')">नया आइडिया</button>
      <button onclick="quickAsk('मेरी किसी समस्या का आसान हल बताओ')">समस्या का हल</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">नमस्ते! मैं JARVIS-D हूँ। आप बोलकर या लिखकर सवाल पूछ सकते हैं।</div>
    </div>

    <div class="input-row">
      <button class="mic-btn" onclick="startListening()">🎤</button>
      <input type="text" id="userInput" placeholder="यहाँ लिखें या माइक दबाएं..." />
      <button class="send-btn" onclick="sendMessage()">भेजें</button>
    </div>
  </div>

  <script>
    let speakEnabled = true;

    window.onload = function () {
      const savedKey = localStorage.getItem("jarvis_gemini_key");
      if (savedKey) {
        document.getElementById("apiKeyInput").value = savedKey;
      }
    };

    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (!key) {
        alert("कृपया वैध API Key डालें।");
        return;
      }
      localStorage.setItem("jarvis_gemini_key", key);
      document.getElementById("statusText").innerText = "API Key सेव हो गई";
    }

    function toggleVoice() {
      speakEnabled = !speakEnabled;
      document.getElementById("voiceToggleBtn").innerText =
        speakEnabled ? "🔊 आवाज़: चालू" : "🔇 आवाज़: बंद";
      if (!speakEnabled && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    }

    function speakText(text) {
      if (!speakEnabled || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "hi-IN";
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    }

    function addMessage(text, sender) {
      const box = document.getElementById("chatBox");
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("इस ब्राउज़र में वॉइस इनपुट सपोर्ट नहीं है। Chrome में खोलकर देखें।");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = "hi-IN";
      recognition.interimResults = false;
      document.getElementById("statusText").innerText = "🎤 सुन रहा हूँ...";

      recognition.onresult = function (event) {
        const spokenText = event.results[0][0].transcript;
        document.getElementById("userInput").value = spokenText;
        document.getElementById("statusText").innerText = "आवाज़ समझ ली गई";
        sendMessage();
      };

      recognition.onerror = function () {
        document.getElementById("statusText").innerText = "आवाज़ नहीं पकड़ पाया";
      };

      recognition.start();
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const prompt = input.value.trim();
      const apiKey = localStorage.getItem("jarvis_gemini_key") || document.getElementById("apiKeyInput").value.trim();

      if (!prompt) return;
      addMessage(prompt, "user");
      input.value = "";

      if (!apiKey) {
        const msg = "कृपया पहले ऊपर Gemini API Key डालकर सेव करें, ताकि मैं लाइव जवाब दे सकूँ।";
        addMessage(msg, "bot");
        speakText(msg);
        return;
      }

      document.getElementById("statusText").innerText = "सोच रहा हूँ...";

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [
                {
                  parts: [
                    {
                      text: "तुम JARVIS-D हो, एक मददगार पर्सनल असिस्टेंट। छोटा, साफ और काम का जवाब दो:\n" + prompt
                    }
                  ]
                }
              ]
            })
          }
        );

        const data = await res.json();
        const reply =
          data?.candidates?.[0]?.content?.parts?.[0]?.text ||
          (data?.error?.message ? "Error: " + data.error.message : "जवाब नहीं मिल पाया।");

        document.getElementById("statusText").innerText = "तैयार";
        addMessage(reply, "bot");
        speakText(reply);
      } catch (err) {
        document.getElementById("statusText").innerText = "कनेक्शन एरर";
        const errMsg = "नेटवर्क या API कॉल में दिक्कत आई: " + err.message;
        addMessage(errMsg, "bot");
        speakText("कनेक्शन में दिक्कत आई है।");
      }
    }

    function quickAsk(promptText) {
      document.getElementById("userInput").value = promptText;
      sendMessage();
    }
  </script>
</body>
</html>
